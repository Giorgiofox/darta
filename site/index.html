      <h1>DARTA — Drone Attack Research and Tactic Analysis</h1>
      <p>
        DARTA is an open-source TTP framework for Unmanned Aerial Systems cybersecurity,
        created by <a href="https://giorgiocampiotti.com">Giorgio Campiotti</a>.
        It catalogs 9 tactics, 53 techniques, and 198 sub-techniques covering consumer drones,
        enterprise UAS, military tactical systems, GCS and UTM infrastructure, and autonomous swarms,
        with 13 countermeasures mapped to NIST SP 800-53, DO-326A, ASTM F38, and EU regulations.
      </p>
      <p>
        Tactics: Reconnaissance, Resource Development, Initial Access, Execution, Persistence,
        Defense Evasion, Lateral Movement, Collection &amp; Exfiltration, Impact.
      </p>
